# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: gcr.io/google-samples/gb-frontend
    tag: v5
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30180
  config:
    appTitle: "My Lab Guestbook"
    appEnv: "lab"
    logLevel: "INFO"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Backend (Redis) configuration
backend:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  auth:
    # Set existingSecret to use an existing Secret (production pattern)
    # Otherwise, password below is used to create a new Secret
    existingSecret: ""
    password: "RedisChangeMe123"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""

# Common settings
nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: guestbook.lab.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
